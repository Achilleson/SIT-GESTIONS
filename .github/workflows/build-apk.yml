name: Construire APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dézipper le projet
        run: unzip -o sit-apk.zip -d app_src
      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Construire APK avec Gradle
        run: |
          cd app_src
          chmod +x ./gradlew || true
          ./gradlew assembleDebug || gradle assembleDebug
      - name: Uploader l'APK
        uses: actions/upload-artifact@v4
        with:
          name: GESTIONS-ASSISES-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
